name: king-of-spades
label: King of Spades
description: Cinematic dark playing-card theme for Hermes Dashboard with antique gold, burgundy suits, and readable glass card chrome.
palette:
  background: '#080b08'
  midground: '#f5e6bd'
  foreground:
    hex: '#ffffff'
    alpha: 0
  warmGlow: rgba(200, 149, 61, 0.10)
  noiseOpacity: 0.18
typography:
  fontSans: '"Spectral", Georgia, "Times New Roman", serif'
  fontMono: '"IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Cinzel", "Spectral", Georgia, serif'
  fontUrl: https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap
  baseSize: 15px
  lineHeight: '1.56'
  letterSpacing: 0.01em
layout:
  radius: 16px
  density: comfortable
layoutVariant: tiled
colorOverrides:
  primary: '#b3312d'
  primaryForeground: '#fff4d0'
  accent: '#c8953d'
  accentForeground: '#080706'
  secondary: '#201611'
  secondaryForeground: '#f5e6bd'
  muted: '#15100d'
  mutedForeground: '#bfa977'
  ring: '#c8953d'
  border: rgba(200, 149, 61, 0.34)
  input: rgba(200, 149, 61, 0.28)
  card: '#15100d'
  cardForeground: '#f5e6bd'
  popover: '#201611'
  popoverForeground: '#f5e6bd'
  success: '#42b36a'
  warning: '#c8953d'
  destructive: '#ff6f66'
componentStyles:
  card:
    background: linear-gradient(180deg, rgba(32,22,17,.62), rgba(18,14,12,.56))
    boxShadow: 0 18px 46px rgba(0,0,0,.36), inset 0 3px 0 rgba(200,149,61,.56), inset 0 0 0 1px rgba(245,230,189,.045)
    clipPath: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px)
  header:
    background: linear-gradient(180deg, rgba(8,7,6,.66), rgba(16,32,21,.54))
    boxShadow: inset 0 -1px 0 rgba(200,149,61,.55)
  sidebar:
    background: linear-gradient(180deg, rgba(28,17,13,.34), rgba(10,14,10,.28))
    boxShadow: inset -1px 0 0 rgba(200,149,61,.32)
  tab:
    clipPath: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%)
    inactiveColor: '#bfa977'
    inactiveOpacity: '1'
    activeColor: '#fff4d0'
    activeOpacity: '1'
  badge:
    background: rgba(200,149,61,.18)
  backdrop:
    fillerOpacity: '0.44'
    fillerBlendMode: normal
    backgroundSize: cover
    backgroundPosition: center right
customCSS: "/* PLAYING CARD ROYALE // DARK TABLE v2\n * Rules learned from Daedalus: dark-first, YAML-only, structural selectors,\n * under Hermes' stock 32KiB cap, descendant contrast contracts. */\n:root {\n  --pc-table: #080b08;\n  --pc-felt: #102015;\n  --pc-felt-2: #162b1c;\n  --pc-card: #15100d;\n  --pc-card-2: #201611;\n  --pc-ivory: #f5e6bd;\n  --pc-ivory-dim: #bfa977;\n  --pc-gold: #c8953d;\n  --pc-gold-2: #8a5b22;\n  --pc-red: #b3312d;\n  --pc-red-dark: #651917;\n  --pc-black: #080706;\n  --pc-green: #42b36a;\n  --pc-blue: #64b7ff;\n  --pc-shadow: rgba(0,0,0,.58);\n}\n\nhtml, body { background: var(--pc-table) !important; }\nimg.theme-default-filler, [class*=\"theme-default-filler\"] { display: none !important; }\n:root { --component-backdrop-filler-opacity: 0 !important; --noise-opacity-mul: .18 !important; }\n\n#root > div[data-layout-variant] {\n  color: var(--pc-ivory) !important;\n  background:\n    linear-gradient(135deg, rgba(5,6,5,.94), rgba(12,18,12,.88), rgba(5,5,4,.96)),\n\
  \    radial-gradient(circle at 18% 10%, rgba(179,49,45,.18), transparent 26%),\n    radial-gradient(circle at 86% 18%, rgba(200,149,61,.14), transparent 24%),\n    var(--theme-asset-bg),\n    linear-gradient(135deg, #070907 0%, #102015 48%, #070706 100%) !important;\n  background-size: cover !important;\n  background-position: center right !important;\n  background-repeat: no-repeat !important;\n}\n#root > div[data-layout-variant]::before {\n  content: \"\";\n  position: fixed;\n  inset: 12px;\n  pointer-events: none;\n  z-index: 2;\n  border: 1px solid rgba(200,149,61,.45);\n  box-shadow: inset 0 0 0 1px rgba(101,25,23,.36), inset 0 0 90px rgba(0,0,0,.5);\n}\n\n.blend-lighter, [class*=\"blend-lighter\"], [style*=\"plus-lighter\"] { mix-blend-mode: normal !important; }\n.font-expanded, [class*=\"font-expanded\"] {\n  font-family: var(--theme-font-display) !important;\n  font-weight: 800 !important;\n  letter-spacing: .05em !important;\n}\n.font-mondwest, [class*=\"font-mondwest\"] {\n\
  \  font-family: var(--theme-font-mono) !important;\n  letter-spacing: .14em !important;\n  text-transform: uppercase !important;\n}\n\nheader[role=\"banner\"] {\n  background: linear-gradient(180deg, rgba(8,7,6,.78), rgba(16,32,21,.68)) !important;\n  border-bottom: 1px solid rgba(200,149,61,.55) !important;\n  box-shadow: 0 18px 40px rgba(0,0,0,.32) !important;\n}\nheader[role=\"banner\"] h1,\nheader[role=\"banner\"] [class*=\"text-midground\"] {\n  color: var(--pc-ivory) !important;\n  -webkit-text-fill-color: var(--pc-ivory) !important;\n  text-shadow: 0 2px 14px rgba(0,0,0,.65) !important;\n  opacity: 1 !important;\n}\n\naside#app-sidebar {\n  width: 17rem !important;\n  margin: 14px 0 14px 14px;\n  height: calc(100dvh - 28px) !important;\n  max-height: calc(100dvh - 28px) !important;\n  color: var(--pc-ivory) !important;\n  background:\n    radial-gradient(circle at 18% 8%, rgba(179,49,45,.16), transparent 28%),\n    linear-gradient(180deg, rgba(28,17,13,.82), rgba(10,14,10,.76))\
  \ !important;\n  border: 1px solid rgba(200,149,61,.52) !important;\n  border-radius: 18px !important;\n  box-shadow: 0 22px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(245,230,189,.06) !important;\n  overflow: hidden;\n}\naside#app-sidebar::before {\n  content: \"A\\A♥\";\n  white-space: pre;\n  position: absolute;\n  top: 16px;\n  left: 17px;\n  z-index: 2;\n  font-family: var(--theme-font-display);\n  font-size: 2rem;\n  font-weight: 800;\n  line-height: .78;\n  color: var(--pc-red);\n  pointer-events: none;\n}\naside#app-sidebar::after {\n  content: \"K\\A♠\";\n  white-space: pre;\n  position: absolute;\n  right: 14px;\n  bottom: 10px;\n  z-index: 2;\n  font-family: var(--theme-font-display);\n  font-size: 1.5rem;\n  font-weight: 800;\n  line-height: .78;\n  color: rgba(245,230,189,.72);\n  pointer-events: none;\n}\naside#app-sidebar > div:first-of-type {\n  min-height: 92px !important;\n  height: 92px !important;\n  padding-left: 78px !important;\n  border-bottom: 1px solid rgba(200,149,61,.32)\
  \ !important;\n  background: rgba(0,0,0,.08) !important;\n}\naside#app-sidebar > div:first-of-type * {\n  color: var(--pc-ivory) !important;\n  -webkit-text-fill-color: var(--pc-ivory) !important;\n  text-shadow: none !important;\n  opacity: 1 !important;\n}\n\naside#app-sidebar nav { padding: 10px !important; }\naside#app-sidebar nav a,\naside#app-sidebar nav button {\n  color: var(--pc-ivory-dim) !important;\n  -webkit-text-fill-color: var(--pc-ivory-dim) !important;\n  opacity: 1 !important;\n  border-radius: 12px !important;\n  border: 1px solid transparent !important;\n  background: transparent !important;\n}\naside#app-sidebar nav a *, aside#app-sidebar nav button * {\n  color: inherit !important;\n  -webkit-text-fill-color: currentColor !important;\n  opacity: 1 !important;\n  stroke: currentColor !important;\n}\naside#app-sidebar nav a:hover, aside#app-sidebar nav button:hover {\n  color: var(--pc-ivory) !important;\n  -webkit-text-fill-color: var(--pc-ivory) !important;\n  background:\
  \ rgba(200,149,61,.10) !important;\n  border-color: rgba(200,149,61,.25) !important;\n}\naside#app-sidebar nav a[aria-current=\"page\"],\naside#app-sidebar nav [data-active=\"true\"],\naside#app-sidebar nav a[class*=\"bg-primary\"] {\n  color: #fff4d0 !important;\n  -webkit-text-fill-color: #fff4d0 !important;\n  background: linear-gradient(180deg, var(--pc-red), var(--pc-red-dark)) !important;\n  border-color: rgba(245,230,189,.28) !important;\n  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 10px 22px rgba(0,0,0,.28) !important;\n  opacity: 1 !important;\n}\naside#app-sidebar nav a[aria-current=\"page\"] *, aside#app-sidebar nav [data-active=\"true\"] * { color: #fff4d0 !important; }\naside#app-sidebar nav span[aria-hidden], aside#app-sidebar nav [aria-hidden][class*=\"bg-midground\"] { display: none !important; }\naside#app-sidebar nav ul { counter-reset: pc-nav; }\naside#app-sidebar nav li { counter-increment: pc-nav; }\naside#app-sidebar nav li > a::before, aside#app-sidebar\
  \ nav li > button::before {\n  content: counter(pc-nav, decimal-leading-zero) \" \";\n  color: var(--pc-gold);\n  font-family: var(--theme-font-mono);\n  font-weight: 700;\n  margin-right: 3px;\n}\n\nmain { color: var(--pc-ivory) !important; }\nmain h1, main h2, main h3, main h4,\nmain [class*=\"font-expanded\"], main [role=\"heading\"] {\n  color: var(--pc-ivory) !important;\n  -webkit-text-fill-color: var(--pc-ivory) !important;\n  mix-blend-mode: normal !important;\n  opacity: 1 !important;\n}\n\n[class*=\"text-card-foreground\"],\n[class*=\"bg-card\"],\n[class*=\"bg-popover\"] {\n  color: var(--pc-ivory) !important;\n  background:\n    linear-gradient(180deg, rgba(32,22,17,.78), rgba(18,14,12,.72)) !important;\n  border: 1px solid rgba(200,149,61,.34) !important;\n  border-radius: 16px !important;\n  box-shadow: 0 18px 46px rgba(0,0,0,.36), inset 0 3px 0 rgba(200,149,61,.56), inset 0 0 0 1px rgba(245,230,189,.045) !important;\n  position: relative;\n}\n[class*=\"text-card-foreground\"\
  ] *, [class*=\"bg-card\"] *, [class*=\"bg-popover\"] * {\n  opacity: 1;\n}\n[class*=\"text-card-foreground\"] :is(p,span,div,li,td,th,label),\n[class*=\"bg-card\"] :is(p,span,div,li,td,th,label) {\n  color: inherit;\n}\nmain [class*=\"text-muted-foreground\"], main [class*=\"text-card-foreground\"] [class*=\"text-muted\"] {\n  color: var(--pc-ivory-dim) !important;\n  -webkit-text-fill-color: var(--pc-ivory-dim) !important;\n}\nmain [class*=\"text-foreground\"], main [class*=\"text-white\"], main [class*=\"text-background\"] {\n  color: var(--pc-ivory) !important;\n  -webkit-text-fill-color: var(--pc-ivory) !important;\n}\n\nbutton, a, input, textarea, select {\n  border-radius: 10px !important;\n}\nbutton[class*=\"bg-primary\"], a[class*=\"bg-primary\"], [class*=\"bg-primary\"] {\n  background: linear-gradient(180deg, var(--pc-red), var(--pc-red-dark)) !important;\n  color: #fff4d0 !important;\n  -webkit-text-fill-color: #fff4d0 !important;\n  border-color: rgba(245,230,189,.22) !important;\n\
  }\nbutton[class*=\"bg-primary\"] *, a[class*=\"bg-primary\"] *, [class*=\"bg-primary\"] * { color: #fff4d0 !important; }\nbutton[class*=\"border\"], input, textarea, select {\n  border-color: rgba(200,149,61,.36) !important;\n}\ninput, textarea, select {\n  background: rgba(8,7,6,.30) !important;\n  color: var(--pc-ivory) !important;\n}\n::placeholder { color: rgba(245,230,189,.48) !important; }\n\n[class*=\"bg-secondary\"], [class*=\"bg-muted\"], [class*=\"bg-accent\"] {\n  background-color: rgba(245,230,189,.055) !important;\n  color: var(--pc-ivory) !important;\n}\n[class*=\"bg-success\"], [class*=\"bg-emerald\"], [class*=\"text-success\"], [class*=\"text-emerald\"] { color: var(--pc-green) !important; }\n[class*=\"bg-warning\"], [class*=\"text-warning\"] { color: var(--pc-gold) !important; }\n[class*=\"bg-destructive\"], [class*=\"text-destructive\"] { color: #ff7a70 !important; }\n\nmark, [class*=\"bg-warning/\"], [class*=\"bg-amber\"], [class*=\"bg-yellow\"] {\n  background: rgba(200,149,61,.22)\
  \ !important;\n  color: var(--pc-ivory) !important;\n}\ndiv[class*=\"ffe6cb\"] { background-color: var(--pc-gold) !important; opacity: 1 !important; }\ndiv[class*=\"emerald-500\"] { background-color: var(--pc-green) !important; opacity: 1 !important; }\n\ntable, thead, tbody, tr, td, th { border-color: rgba(200,149,61,.18) !important; }\nth { color: var(--pc-gold) !important; font-family: var(--theme-font-mono) !important; letter-spacing: .14em !important; }\ncode, pre, [class*=\"font-mono\"] { color: var(--pc-ivory) !important; }\n\n/* Strong-surface card contract: if we paint it red/gold, descendants stay readable. */\naside#app-sidebar nav a[aria-current=\"page\"] *,\naside#app-sidebar nav [data-active=\"true\"] *,\nbutton[class*=\"bg-primary\"] *,\n[class*=\"bg-primary\"] *,\n[class*=\"bg-destructive\"] * {\n  color: #fff4d0 !important;\n  -webkit-text-fill-color: #fff4d0 !important;\n  opacity: 1 !important;\n}\n\n*::-webkit-scrollbar { width: 8px; height: 8px; }\n*::-webkit-scrollbar-track\
  \ { background: rgba(0,0,0,.45); }\n*::-webkit-scrollbar-thumb { background: var(--pc-gold); border: 1px solid rgba(0,0,0,.55); border-radius: 999px; }\n::selection { background: var(--pc-red); color: #fff4d0; }\n\n/* PC_BACKGROUND_VISIBILITY_FIX */\n:root {\n  --component-backdrop-filler-opacity: .44 !important;\n  --component-backdrop-filler-blend-mode: normal !important;\n  --component-backdrop-background-size: cover !important;\n  --component-backdrop-background-position: center right !important;\n}\n#root > div[data-layout-variant] {\n  background:\n    linear-gradient(135deg, rgba(5,6,5,.70), rgba(12,18,12,.58), rgba(5,5,4,.74)),\n    radial-gradient(circle at 18% 10%, rgba(179,49,45,.12), transparent 26%),\n    radial-gradient(circle at 86% 18%, rgba(200,149,61,.10), transparent 24%),\n    var(--theme-asset-bg),\n    linear-gradient(135deg, #070907 0%, #102015 48%, #070706 100%) !important;\n  background-size: cover !important;\n  background-position: center right !important;\n\
  \  background-repeat: no-repeat !important;\n}\n\n\n\n/* PC_REMOVE_ACE_SPADE_WATERMARK */\n#root > div[data-layout-variant]::after {\n  content: none !important;\n  display: none !important;\n}\n\n\n/* PC_REMOVE_OLD_SPADE_BACKGROUNDS */\n#root > div[data-layout-variant]::after,\nmain::before {\n  content: none !important;\n  display: none !important;\n  background-image: none !important;\n}\n\n\n/* PC_VISUAL_REFINEMENTS_20260426 */\n/* 1. Remove red/black four-dot card pips. */\n[class*=\"text-card-foreground\"]::before,\n[class*=\"bg-card\"]::before {\n  content: none !important;\n  display: none !important;\n  box-shadow: none !important;\n  background: transparent !important;\n}\n\n/* 2. Move the bottom K spade away from the Nous Research wordmark. */\naside#app-sidebar::after {\n  right: 4px !important;\n  bottom: 18px !important;\n  transform: translateX(10px) !important;\n  opacity: .62 !important;\n}\n\n/* 3. Remove the top Royal Table label so page titles like Analytics do not\
  \ overlap. */\nheader[role=\"banner\"]::before {\n  content: none !important;\n  display: none !important;\n}\nheader[role=\"banner\"] h1 {\n  margin-left: 0 !important;\n}\n\n/* 4. Glassier surfaces so the uploaded background reads through. */\n[class*=\"bg-card\"],\n[class*=\"text-card-foreground\"],\n[class*=\"bg-popover\"] {\n  background: linear-gradient(180deg, rgba(32,22,17,.78), rgba(18,14,12,.72)) !important;\n  backdrop-filter: blur(7px) saturate(1.05) !important;\n  -webkit-backdrop-filter: blur(7px) saturate(1.05) !important;\n  border-color: rgba(200,149,61,.28) !important;\n}\n[class*=\"bg-secondary\"],\n[class*=\"bg-muted\"],\n[class*=\"bg-accent\"] {\n  background-color: rgba(245,230,189,.055) !important;\n  backdrop-filter: blur(5px) !important;\n  -webkit-backdrop-filter: blur(5px) !important;\n}\nheader[role=\"banner\"] {\n  background: linear-gradient(180deg, rgba(8,7,6,.78), rgba(16,32,21,.68)) !important;\n  backdrop-filter: blur(8px) saturate(1.08) !important;\n\
  \  -webkit-backdrop-filter: blur(8px) saturate(1.08) !important;\n}\naside#app-sidebar {\n  background: radial-gradient(circle at 18% 8%, rgba(179,49,45,.10), transparent 28%), linear-gradient(180deg, rgba(28,17,13,.82), rgba(10,14,10,.76)) !important;\n  backdrop-filter: blur(8px) saturate(1.08) !important;\n  -webkit-backdrop-filter: blur(8px) saturate(1.08) !important;\n}\n/* END_PC_VISUAL_REFINEMENTS_20260426 */\n\n\n/* PC_MORE_BACKGROUND_VISIBILITY_20260426 */\n/* More background, less heavy chrome. */\n[class*=\"bg-card\"],\n[class*=\"text-card-foreground\"],\n[class*=\"bg-popover\"] {\n  background: linear-gradient(180deg, rgba(32,22,17,.62), rgba(18,14,12,.56)) !important;\n  backdrop-filter: blur(5px) saturate(1.03) !important;\n  -webkit-backdrop-filter: blur(5px) saturate(1.03) !important;\n  border-color: rgba(200,149,61,.24) !important;\n  box-shadow: 0 14px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(200,149,61,.30), inset 0 0 0 1px rgba(245,230,189,.035) !important;\n}\n[class*=\"\
  bg-secondary\"],\n[class*=\"bg-muted\"],\n[class*=\"bg-accent\"] {\n  background-color: rgba(245,230,189,.035) !important;\n  backdrop-filter: blur(4px) !important;\n  -webkit-backdrop-filter: blur(4px) !important;\n}\ninput, textarea, select {\n  background: rgba(8,7,6,.22) !important;\n}\nheader[role=\"banner\"] {\n  background: linear-gradient(180deg, rgba(8,7,6,.66), rgba(16,32,21,.54)) !important;\n  backdrop-filter: blur(6px) saturate(1.04) !important;\n  -webkit-backdrop-filter: blur(6px) saturate(1.04) !important;\n}\naside#app-sidebar {\n  background: radial-gradient(circle at 18% 8%, rgba(179,49,45,.07), transparent 30%), linear-gradient(180deg, rgba(28,17,13,.52), rgba(10,14,10,.44)) !important;\n  backdrop-filter: blur(5px) saturate(1.04) !important;\n  -webkit-backdrop-filter: blur(5px) saturate(1.04) !important;\n  border-color: rgba(200,149,61,.34) !important;\n  box-shadow: 0 18px 46px rgba(0,0,0,.34), inset 0 0 0 1px rgba(245,230,189,.04) !important;\n}\naside#app-sidebar\
  \ > div:first-of-type,\naside#app-sidebar > div:nth-last-of-type(2),\naside#app-sidebar > div:last-of-type {\n  background: rgba(0,0,0,.035) !important;\n}\n\n/* Put K♠ between the footer version and Nous Research text. */\naside#app-sidebar::after {\n  content: \"K\\A♠\" !important;\n  white-space: pre !important;\n  left: 50% !important;\n  right: auto !important;\n  bottom: 7px !important;\n  transform: translateX(-50%) !important;\n  font-size: .92rem !important;\n  line-height: .70 !important;\n  opacity: .58 !important;\n  z-index: 3 !important;\n}\n/* END_PC_MORE_BACKGROUND_VISIBILITY_20260426 */\n\n\n/* PC_LEFT_PANEL_MORE_TRANSPARENT_20260426 */\naside#app-sidebar {\n  background: radial-gradient(circle at 18% 8%, rgba(179,49,45,.045), transparent 32%), linear-gradient(180deg, rgba(28,17,13,.34), rgba(10,14,10,.28)) !important;\n  backdrop-filter: blur(3px) saturate(1.02) !important;\n  -webkit-backdrop-filter: blur(3px) saturate(1.02) !important;\n  border-color: rgba(200,149,61,.24)\
  \ !important;\n  box-shadow: 0 14px 34px rgba(0,0,0,.24), inset 0 0 0 1px rgba(245,230,189,.025) !important;\n}\naside#app-sidebar > div:first-of-type,\naside#app-sidebar > div:nth-last-of-type(2),\naside#app-sidebar > div:last-of-type,\naside#app-sidebar nav {\n  background: transparent !important;\n}\naside#app-sidebar nav a,\naside#app-sidebar nav button {\n  background: rgba(0,0,0,.02) !important;\n}\naside#app-sidebar nav a:hover,\naside#app-sidebar nav button:hover {\n  background: rgba(200,149,61,.055) !important;\n}\naside#app-sidebar nav a[aria-current=\"page\"],\naside#app-sidebar nav [data-active=\"true\"],\naside#app-sidebar nav a[class*=\"bg-primary\"] {\n  background: linear-gradient(180deg, rgba(179,49,45,.72), rgba(101,25,23,.64)) !important;\n}\n/* END_PC_LEFT_PANEL_MORE_TRANSPARENT_20260426 */\n"
assets:
  bg: /dashboard-plugins/king-of-spades/assets/card-background.png
  custom:
    cardBackground: /dashboard-plugins/king-of-spades/assets/card-background.png
